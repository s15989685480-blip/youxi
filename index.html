<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跳一跳闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: linear-gradient(180deg, #87CEFA, #E0F7FA);
            font-family: system-ui, sans-serif;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .ui-box {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        .score-text {
            font-size: 22px;
            color: #222;
            font-weight: bold;
        }
        .level-text {
            font-size: 16px;
            margin-top:4px;
            color:#444;
        }
        .game-over-panel{
            position:fixed;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            background:#ffffffdd;
            padding:30px 24px;
            border-radius:16px;
            text-align:center;
            display:none;
            min-width:260px;
        }
        .game-over-panel h2{
            margin-bottom:12px;
        }
        .restart-btn{
            margin-top:16px;
            padding:10px 24px;
            font-size:17px;
            border:none;
            background:#2196F3;
            color:white;
            border-radius:8px;
        }
        /*音乐按钮*/
        .music-btn{
            position:fixed;
            top:22px;
            right:16px;
            width:40px;
            height:40px;
            border-radius:50%;
            border:none;
            background:#ffffffbb;
            font-size:20px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <button class="music-btn" id="musicBtn">🔊</button>
    <div class="ui-box">
        <div class="score-text">分数：<span id="scoreVal">0</span></div>
        <div class="level-text">关卡：<span id="levelVal">1</span></div>
    </div>
    <div class="game-over-panel" id="overPanel">
        <h2>游戏结束</h2>
        <p>得分：<span id="finalScore">0</span></p>
        <p>到达关卡：<span id="finalLevel">1</span></p>
        <button class="restart-btn" id="restartBtn">重新开始</button>
    </div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let score = 0;
let level = 1;
let isGameOver = false;

// 背景音乐
const bgm = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");
bgm.loop = true;
bgm.volume = 0.35;
let musicOn = true;
let audioStarted = false;
const musicBtn = document.getElementById("musicBtn");

//切换音乐
musicBtn.addEventListener("click",()=>{
    if(!audioStarted){
        bgm.play();
        audioStarted=true;
        musicOn=true;
        musicBtn.innerText="🔊";
        return;
    }
    musicOn = !musicOn;
    if(musicOn){
        bgm.play();
        musicBtn.innerText="🔊";
    }else{
        bgm.pause();
        musicBtn.innerText="🔇";
    }
});

// 用户第一次点击画布时启动音频（浏览器策略）
function tryStartAudio(){
    if(!audioStarted && musicOn){
        bgm.play().then(()=>{
            audioStarted=true;
        }).catch(e=>{});
    }
}

// 玩家方块
const player = {
    x:0,
    y:0,
    w:24,
    h:36,
    vx:0,
    vy:0,
    onGround:true
};
let platforms = [];
let holdStartTime = 0;
let isHolding = false;
let power = 0;
const maxPower = 700;

// 记录上一次踩过的平台索引，防止重复加分
let lastStepIndex = 0;
// 每跳满这个数量升级关卡，你可以修改这个数字
const STEP_PER_LEVEL = 5;

// 适配画布尺寸
function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

// 生成平台（难度随level变化）
function createPlatform(startX){
    const baseGap = 70 + level * 6;
    const pw = Math.max(35, 50 + Math.random()*40 - level*2); //等级越高平台越窄
    const gap = 60 + Math.random()*baseGap;
    return {
        x: startX + gap,
        y: canvas.height * 0.65,
        w: pw,
        h:22,
        color: `hsl(${Math.random()*360},55%,60%)`
    }
}

// 初始化游戏
function initGame(){
    score = 0;
    level = 1;
    isGameOver = false;
    platforms = [];
    lastStepIndex = 0;

    const first = {
        x: canvas.width*0.25,
        y: canvas.height*0.65,
        w:70,
        h:22,
        color:"#3498db"
    };
    platforms.push(first);
    for(let i=0;i<6;i++){
        platforms.push(createPlatform(platforms[platforms.length-1].x));
    }
    player.x = first.x + first.w/2 - player.w/2;
    player.y = first.y - player.h;
    player.vx = 0;
    player.vy =0;
    player.onGround = true;

    document.getElementById("overPanel").style.display="none";
    updateUi();
}

function updateUi(){
    document.getElementById("scoreVal").innerText = score;
    document.getElementById("levelVal").innerText = level;
}

// 蓄力开始
function startHold(){
    tryStartAudio();
    if(isGameOver || !player.onGround) return;
    isHolding = true;
    holdStartTime = performance.now();
}

// 释放跳跃
function endHold(){
    if(!isHolding || isGameOver){
        isHolding=false;
        power=0;
        return;
    }
    const dt = performance.now() - holdStartTime;
    power = Math.min(dt,maxPower);
    const scale = power / maxPower;
    player.vx = 4.4 * scale;
    player.vy = -10.5 * scale;
    player.onGround = false;
    isHolding = false;
    power = 0;
}

// 物理更新
function physics(){
    if(isGameOver) return;

    if(isHolding && player.onGround){
        const dt = performance.now() - holdStartTime;
        power = Math.min(dt,maxPower);
    }

    if(!player.onGround){
        player.vy +=0.42;
        player.x += player.vx;
        player.y += player.vy;
        player.vx *=0.995;
    }

    player.onGround = false;
    // 碰撞平台
    for(let i=0;i<platforms.length;i++){
        const plat = platforms[i];
        if(player.vy>=0
            && player.x+player.w > plat.x
            && player.x < plat.x+plat.w
            && player.y+player.h >= plat.y
            && player.y+player.h <= plat.y+18){
            player.y = plat.y - player.h;
            player.vy = 0;
            player.vx = 0;
            player.onGround = true;

            // 只有跳到新平台才加分
            if(i > lastStepIndex){
                lastStepIndex = i;
                const centerP = player.x + player.w/2;
                const centerPlat = plat.x + plat.w/2;
                const dis = Math.abs(centerP-centerPlat);
                if(dis < 12){
                    score +=2;
                }else{
                    score +=1;
                }
                // ✅ 修改这里：根据总跳数升级关卡，不再跳一次+1
                const totalJump = lastStepIndex;
                const newLevel = Math.floor(totalJump / STEP_PER_LEVEL)+1;
                if(newLevel > level){
                    level = newLevel;
                }

                // 每跳上新平台，生成后续平台
                while(platforms.length < i+7){
                    platforms.push(createPlatform(platforms[platforms.length-1].x));
                }
                updateUi();
            }
            break;
        }
    }

    // 清理屏幕左侧已经跑出去的旧平台，防止数组无限增大
    const camX = player.x - canvas.width *0.35;
    platforms = platforms.filter(p=> p.x + p.w > camX - 200);

    // 掉落判定：掉下面，或者跑出屏幕左边
    if(player.y > canvas.height + 80 || player.x + player.w < camX - 100){
        gameOver();
    }
}

function gameOver(){
    isGameOver = true;
    document.getElementById("finalScore").innerText = score;
    document.getElementById("finalLevel").innerText = level;
    document.getElementById("overPanel").style.display="block";
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // 相机偏移
    const camX = player.x - canvas.width *0.35;
    ctx.save();
    ctx.translate(-camX,0);

    // 绘制平台
    for(let p of platforms){
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.roundRect(p.x,p.y,p.w,p.h,6);
        ctx.fill();
    }

    // 绘制玩家小人
    ctx.fillStyle="#222222";
    ctx.fillRect(player.x,player.y,player.w,player.h);

    // 蓄力指示条
    if(isHolding && player.onGround){
        const pw = power/maxPower *44;
        ctx.fillStyle="#ff4444";
        ctx.fillRect(player.x, player.y-12, pw,6);
    }
    ctx.restore();
}

function loop(){
    physics();
    draw();
    requestAnimationFrame(loop);
}

// 鼠标事件
canvas.addEventListener('mousedown',startHold);
canvas.addEventListener('mouseup',endHold);
canvas.addEventListener('mouseleave',endHold);

// 触摸事件（手机）
canvas.addEventListener('touchstart',(e)=>{
    e.preventDefault();
    startHold();
});
canvas.addEventListener('touchend',(e)=>{
    e.preventDefault();
    endHold();
});
canvas.addEventListener('touchcancel',endHold);

document.getElementById("restartBtn").addEventListener("click",initGame);

initGame();
loop();
</script>
</body>
</html>
