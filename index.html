<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>跳一跳闯关</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: linear-gradient(180deg, #87CEFA, #E0F7FA);
            font-family: system-ui, sans-serif;
            touch-action: none;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .ui-box {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
        .score-text {
            font-size: 22px;
            color: #222;
            font-weight: bold;
        }
        .level-text {
            font-size: 16px;
            margin-top:4px;
            color:#444;
        }
        .game-over-panel{
            position:fixed;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            background:#ffffffdd;
            padding:30px 24px;
            border-radius:16px;
            text-align:center;
            display:none;
            min-width:260px;
        }
        .game-over-panel h2{
            margin-bottom:12px;
        }
        .restart-btn{
            margin-top:16px;
            padding:10px 24px;
            font-size:17px;
            border:none;
            background:#2196F3;
            color:white;
            border-radius:8px;
        }
        .music-btn{
            position:fixed;
            top:22px;
            right:16px;
            width:40px;
            height:40px;
            border-radius:50%;
            border:none;
            background:#ffffffbb;
            font-size:20px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <button class="music-btn" id="musicBtn">🔊</button>
    <div class="ui-box">
        <div class="score-text">分数：<span id="scoreVal">0</span></div>
        <div class="level-text">关卡：<span id="levelVal">1</span></div>
    </div>
    <div class="game-over-panel" id="overPanel">
        <h2>游戏结束</h2>
        <p>得分：<span id="finalScore">0</span></p>
        <p>到达关卡：<span id="finalLevel">1</span></p>
        <button class="restart-btn" id="restartBtn">重新开始</button>
    </div>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let score = 0;
let level = 1;
let isGameOver = false;
let globalPlatId = 0;
let steppedPlatId = -1;
const SCORE_PER_LEVEL = 500;

// 背景音乐
const bgm = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");
bgm.loop = true;
bgm.volume = 0.35;
let musicOn = true;
let audioStarted = false;
const musicBtn = document.getElementById("musicBtn");

musicBtn.addEventListener("click",()=>{
    if(!audioStarted){
        bgm.play();
        audioStarted=true;
        musicOn=true;
        musicBtn.innerText="🔊";
        return;
    }
    musicOn = !musicOn;
    if(musicOn){
        bgm.play();
        musicBtn.innerText="🔊";
    }else{
        bgm.pause();
        musicBtn.innerText="🔇";
    }
});

function tryStartAudio(){
    if(!audioStarted && musicOn){
        bgm.play().catch(e=>{});
    }
}

const player = {
    x:0,
    y:0,
    w:24,
    h:36,
    vx:0,
    vy:0,
    onGround:true
};
let platforms = [];
let holdStartTime = 0;
let isHolding = false;
let power = 0;
const maxPower = 700;

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize',resizeCanvas);

//生成平台，优化间隙，增加最大上限，不会无限变大
function createPlatform(startX){
    globalPlatId++;
    // 修改：每级只+3，最大基础间隙限制在 95，不会无限增长
    const baseGap = Math.min(70 + level * 3, 95);
    const pw = Math.max(35, 50 + Math.random()*40 - level*2);
    const gap = 60 + Math.random()*baseGap;
    const baseY = canvas.height * 0.65;
    //高度随机起伏
    const yOffset = (Math.random()-0.5)*80;
    let plat = {
        id: globalPlatId,
        x: startX + gap,
        y: baseY + yOffset,
        originY: baseY + yOffset,
        w: pw,
        h:22,
        color: `hsl(${Math.random()*360},55%,60%)`,
        isMoving:false,
        originX:0,
        moveDir:1,
        moveRange:45,
        moveSpeed:1.2,
        isFragile:false,
        fragTimer:0,
        breaking:false
    };

    //Lv3之后概率生成移动平台
    if(level >=3 && Math.random() <0.35){
        plat.isMoving = true;
        plat.originX = plat.x;
    }
    //Lv5之后概率生成易碎红色平台
    if(level >=5 && Math.random() <0.28){
        plat.isFragile = true;
        plat.color="#e74c3c";
    }
    return plat;
}

function initGame(){
    score = 0;
    level = 1;
    isGameOver = false;
    globalPlatId = 0;
    steppedPlatId = -1;
    platforms = [];

    const first = {
        id: globalPlatId++,
        x: canvas.width*0.25,
        y: canvas.height*0.65,
        originY: canvas.height*0.65,
        w:70,
        h:22,
        color:"#3498db",
        isMoving:false,
        originX:0,
        moveDir:1,
        moveRange:0,
        moveSpeed:0,
        isFragile:false,
        fragTimer:0,
        breaking:false
    };
    platforms.push(first);
    for(let i=0;i<6;i++){
        platforms.push(createPlatform(platforms[platforms.length-1].x));
    }
    player.x = first.x + first.w/2 - player.w/2;
    player.y = first.y - player.h;
    player.vx = 0;
    player.vy =0;
    player.onGround = true;

    document.getElementById("overPanel").style.display="none";
    updateUi();
}

function updateUi(){
    document.getElementById("scoreVal").innerText = score;
    document.getElementById("levelVal").innerText = level;
}

function startHold(){
    tryStartAudio();
    if(isGameOver || !player.onGround) return;
    isHolding = true;
    holdStartTime = performance.now();
}

function endHold(){
    if(!isHolding || isGameOver){
        isHolding=false;
        power=0;
        return;
    }
    const dt = performance.now() - holdStartTime;
    power = Math.min(dt,maxPower);
    const scale = power / maxPower;
    player.vx = 4.4 * scale;
    player.vy = -10.5 * scale;
    player.onGround = false;
    isHolding = false;
    power = 0;
}

function physics(){
    if(isGameOver) return;

    //更新移动平台
    for(let p of platforms){
        if(p.isMoving){
            p.x += p.moveDir * p.moveSpeed;
            if(Math.abs(p.x - p.originX)>p.moveRange){
                p.moveDir *= -1;
            }
        }
        //易碎平台计时
        if(p.breaking){
            p.fragTimer +=1;
        }
    }
    //移除碎裂完成的平台
    platforms = platforms.filter(p=>!(p.breaking && p.fragTimer>35));

    if(isHolding && player.onGround){
        const dt = performance.now() - holdStartTime;
        power = Math.min(dt,maxPower);
    }

    if(!player.onGround){
        player.vy +=0.42;
        player.x += player.vx;
        player.y += player.vy;
        player.vx *=0.995;
    }

    player.onGround = false;
    for(let i=0;i<platforms.length;i++){
        const plat = platforms[i];
        if(plat.breaking) continue;
        if(player.vy>=0
            && player.x+player.w > plat.x
            && player.x < plat.x+plat.w
            && player.y+player.h >= plat.y
            && player.y+player.h <= plat.y+18){
            player.y = plat.y - player.h;
            player.vy = 0;
            player.vx = 0;
            player.onGround = true;

            //易碎平台踩上去开始碎裂倒计时
            if(plat.isFragile && !plat.breaking){
                plat.breaking=true;
            }

            if(plat.id !== steppedPlatId){
                steppedPlatId = plat.id;
                const centerP = player.x + player.w/2;
                const centerPlat = plat.x + plat.w/2;
                const dis = Math.abs(centerP-centerPlat);
                //缩小完美判定 dis<6
                if(dis < 6){
                    score += 200;
                }else{
                    score += 100;
                }
                const newLv = Math.floor(score / SCORE_PER_LEVEL)+1;
                if(newLv>level){
                    level = newLv;
                }
                while(platforms.length < i+7){
                    platforms.push(createPlatform(platforms[platforms.length-1].x));
                }
                updateUi();
            }
            break;
        }
    }

    const camX = player.x - canvas.width *0.35;
    platforms = platforms.filter(p=> p.x + p.w > camX - 200);

    if(player.y > canvas.height + 80 || player.x + player.w < camX -100){
        gameOver();
    }
}

function gameOver(){
    isGameOver = true;
    document.getElementById("finalScore").innerText = score;
    document.getElementById("finalLevel").innerText = level;
    document.getElementById("overPanel").style.display="block";
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const camX = player.x - canvas.width *0.35;
    ctx.save();
    ctx.translate(-camX,0);

    for(let p of platforms){
        ctx.fillStyle = p.color;
        if(p.breaking){
            ctx.globalAlpha = 0.45;
        }
        ctx.beginPath();
        ctx.roundRect(p.x,p.y,p.w,p.h,6);
        ctx.fill();
        ctx.globalAlpha =1;
    }

    ctx.fillStyle="#222222";
    ctx.fillRect(player.x,player.y,player.w,player.h);

    if(isHolding && player.onGround){
        const pw = power/maxPower *44;
        ctx.fillStyle="#ff4444";
        ctx.fillRect(player.x, player.y-12, pw,6);
    }
    ctx.restore();
}

function loop(){
    physics();
    draw();
    requestAnimationFrame(loop);
}

canvas.addEventListener('mousedown',startHold);
canvas.addEventListener('mouseup',endHold);
canvas.addEventListener('mouseleave',endHold);

canvas.addEventListener('touchstart',(e)=>{
    e.preventDefault();
    startHold();
});
canvas.addEventListener('touchend',(e)=>{
    e.preventDefault();
    endHold();
});
canvas.addEventListener('touchcancel',endHold);

document.getElementById("restartBtn").addEventListener("click",initGame);

initGame();
loop();
</script>
</body>
</html>
